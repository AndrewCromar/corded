name: Release builds

# Builds self-contained programs for Linux on x86-64 and ARM64 (Raspberry Pi).
# Every push to main or next keeps a downloadable build; a tag starting with
# "v" also publishes a GitHub release.
on:
  push:
    branches: [main, next]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # An older Debian, so the result also runs on systems with an older C
    # library, such as Raspberry Pi OS based on Debian 12.
    container: debian:12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake ninja-build pkg-config python3 curl zip unzip tar \
            autoconf autoconf-archive automake libtool perl linux-libc-dev file

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-debian12-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', '.gitmodules') }}
          restore-keys: vcpkg-debian12-${{ matrix.arch }}-

      - name: Build
        run: ./build.sh -DCORDED_BUNDLED_SODIUM=ON

      - name: Test
        run: ctest --preset dev

      - name: Package
        id: package
        run: |
          version=$(git describe --tags --match 'v*' --always --dirty)
          name="corded-${version}-linux-${{ matrix.arch }}"
          cmake --install build/dev --prefix "dist/${name}" --strip
          cp packaging/README.txt "dist/${name}/README.txt"
          cp packaging/install-server.sh "dist/${name}/install-server.sh"
          cp docs/operator/hosting-at-home.md "dist/${name}/HOSTING-AT-HOME.md"
          # Nothing beyond the system C library may be needed at run time.
          for program in cordedd corded-tui corded-cli; do
            echo "== ${program}"; ldd "dist/${name}/${program}" || true
            if ldd "dist/${name}/${program}" | grep -E "libstdc\+\+|libsodium|libssl|libcrypto|libsqlite"; then
              echo "${program} depends on a library that may be missing elsewhere"; exit 1
            fi
          done
          "dist/${name}/cordedd" --help >/dev/null
          tar -C dist -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      # A server that updates itself installs only what carries this signature
      # (server/src/update.hpp). The private key exists only as this secret.
      - name: Sign the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          name="${{ steps.package.outputs.name }}"
          if [ -z "$RELEASE_SIGNING_KEY" ]; then echo "no release key set; this release goes out unsigned"; exit 0; fi
          apt-get install -y --no-install-recommends openssl >/dev/null
          key="$(mktemp)"; chmod 600 "$key"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" -in "${name}.tar.gz" -out "${name}.tar.gz.sig"
          rm -f "$key"
          openssl pkeyutl -verify -rawin -pubin -inkey packaging/release-signing.pub \
            -in "${name}.tar.gz" -sigfile "${name}.tar.gz.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get install -y --no-install-recommends gh || true
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --prerelease \
            --notes "Pre-alpha build. Not security audited. See the README for how to run it." \
            || gh release view "$tag" >/dev/null  # another job made it in the same moment
          gh release upload "$tag" "${{ steps.package.outputs.name }}.tar.gz" \
            "${{ steps.package.outputs.name }}.tar.gz.sha256" --clobber
          if [ -f "${{ steps.package.outputs.name }}.tar.gz.sig" ]; then
            gh release upload "$tag" "${{ steps.package.outputs.name }}.tar.gz.sig" --clobber
          fi

  android:
    name: The core for phones
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 git curl zip unzip tar \
            perl autoconf automake libtool autoconf-archive

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-android-arm64-v8a-${{ hashFiles('vcpkg.json', '.gitmodules') }}
          restore-keys: vcpkg-android-arm64-v8a-

      - name: Build the core for phones
        run: |
          git submodule update --init external/vcpkg
          ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cmake --preset android-arm64
          cmake --build --preset android-arm64

      # The core on its own, for programs built elsewhere on top of it (the
      # app has a repository of its own and fetches this). The Linux and
      # Windows libraries are in the archives of those platforms.
      - name: Package the core for phones
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          version=$(git describe --tags --match 'v*' --always --dirty)
          name="corded-core-${version}-android-arm64"
          mkdir -p "dist/${name}/jniLibs/arm64-v8a" "dist/${name}/include/corded"
          cp build/android-arm64/lib/libcorded.so "dist/${name}/jniLibs/arm64-v8a/"
          cp include/corded/corded.h "dist/${name}/include/corded/"
          tar -C dist -czf "${name}.tar.gz" "${name}"
          if [ -n "$RELEASE_SIGNING_KEY" ] && [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            key="$(mktemp)"; chmod 600 "$key"; printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
            openssl pkeyutl -sign -rawin -inkey "$key" -in "${name}.tar.gz" -out "${name}.tar.gz.sig"
            rm -f "$key"
            openssl pkeyutl -verify -rawin -pubin -inkey packaging/release-signing.pub -in "${name}.tar.gz" -sigfile "${name}.tar.gz.sig"
          fi
          echo "CORE_ARCHIVE=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --prerelease \
            --notes "Pre-alpha build. Not security audited. See the README for how to run it." \
            || gh release view "$tag" >/dev/null  # another job made it in the same moment
          gh release upload "$tag" "$CORE_ARCHIVE" --clobber
          if [ -f "$CORE_ARCHIVE.sig" ]; then gh release upload "$tag" "$CORE_ARCHIVE.sig" --clobber; fi

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', '.gitmodules') }}
          restore-keys: vcpkg-windows-

      - name: Fetch vcpkg
        shell: cmd
        run: |
          git submodule update --init --depth 1 external/vcpkg
          call external\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --preset windows || exit /b 1
          cmake --build --preset windows || exit /b 1

      - name: Unit tests
        shell: cmd
        run: build\windows\bin\corded_unit_tests.exe

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = git describe --tags --match 'v*' --always --dirty
          $name = "corded-$version-windows-x64"
          New-Item -ItemType Directory -Force "dist\$name" | Out-Null
          Copy-Item build\windows\bin\cordedd.exe, build\windows\bin\corded-tui.exe, build\windows\bin\corded-cli.exe, build\windows\bin\corded.dll "dist\$name\"
          Copy-Item packaging\README-windows.txt "dist\$name\README.txt"
          Copy-Item LICENSE "dist\$name\"
          Compress-Archive -Path "dist\$name" -DestinationPath "$name.zip"
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --prerelease \
            --notes "Pre-alpha build. Not security audited. See the README for how to run it." \
            || gh release view "$tag" >/dev/null  # another job made it in the same moment
          gh release upload "$tag" "${{ steps.package.outputs.name }}.zip" --clobber

  # The app is built in a repository of its own (opencorded/app) and has its
  # own releases. Copies of the app made before that moved look for updates
  # here, so each release here also carries the newest app, under the names
  # those copies ask for. The files are the app repository's own, with their
  # signatures; nothing is rebuilt or re-signed.
  app:
    name: The app, carried over
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the newest app release and attach it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          app=$(gh release list --repo opencorded/app --limit 30 --json tagName -q '[.[] | select(.tagName | startswith("v"))][0].tagName')
          echo "carrying app ${app} in ${tag}"
          mkdir app && cd app
          gh release download "$app" --repo opencorded/app
          # What an older copy of the app asks for is named after this release.
          mv "corded-app-${app}-linux-x86_64.tar.gz" "corded-app-${tag}-linux-x86_64.tar.gz"
          mv "corded-app-${app}-linux-x86_64.tar.gz.sig" "corded-app-${tag}-linux-x86_64.tar.gz.sig"
          mv "corded-app-${app}-windows-x64.zip" "corded-app-${tag}-windows-x64.zip"
          mv "corded-app-${app}-windows-x64.zip.sig" "corded-app-${tag}-windows-x64.zip.sig"
          for file in corded-android-arm64.apk "corded-app-${tag}-linux-x86_64.tar.gz" "corded-app-${tag}-windows-x64.zip"; do
            openssl pkeyutl -verify -rawin -pubin -inkey ../packaging/release-signing.pub -in "$file" -sigfile "$file.sig"
          done
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --prerelease \
            --notes "Pre-alpha build. Not security audited. See the README for how to run it." \
            || gh release view "$tag" >/dev/null  # another job made it in the same moment
          gh release upload "$tag" corded-android-arm64.apk corded-android-arm64.apk.sig \
            "corded-app-${tag}-linux-x86_64.tar.gz" "corded-app-${tag}-linux-x86_64.tar.gz.sig" \
            "corded-app-${tag}-windows-x64.zip" "corded-app-${tag}-windows-x64.zip.sig" --clobber
