name: Release builds

# Builds self-contained programs for Linux on x86-64 and ARM64 (Raspberry Pi).
# Every push to main or next keeps a downloadable build; a tag starting with
# "v" also publishes a GitHub release.
on:
  push:
    branches: [main, next]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # An older Debian, so the result also runs on systems with an older C
    # library, such as Raspberry Pi OS based on Debian 12.
    container: debian:12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake ninja-build pkg-config python3 curl zip unzip tar \
            autoconf autoconf-archive automake libtool perl linux-libc-dev file

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-debian12-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', '.gitmodules') }}
          restore-keys: vcpkg-debian12-${{ matrix.arch }}-

      - name: Build
        run: ./build.sh -DCORDED_BUNDLED_SODIUM=ON

      - name: Test
        run: ctest --preset dev

      - name: Package
        id: package
        run: |
          version=$(git describe --tags --match 'v*' --always --dirty)
          name="corded-${version}-linux-${{ matrix.arch }}"
          cmake --install build/dev --prefix "dist/${name}" --strip
          cp packaging/README.txt "dist/${name}/README.txt"
          cp packaging/install-server.sh "dist/${name}/install-server.sh"
          cp docs/operator/hosting-at-home.md "dist/${name}/HOSTING-AT-HOME.md"
          # Nothing beyond the system C library may be needed at run time.
          for program in cordedd corded-tui corded-cli; do
            echo "== ${program}"; ldd "dist/${name}/${program}" || true
            if ldd "dist/${name}/${program}" | grep -E "libstdc\+\+|libsodium|libssl|libcrypto|libsqlite"; then
              echo "${program} depends on a library that may be missing elsewhere"; exit 1
            fi
          done
          "dist/${name}/cordedd" --help >/dev/null
          tar -C dist -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      # A server that updates itself installs only what carries this signature
      # (server/src/update.hpp). The private key exists only as this secret.
      - name: Sign the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          name="${{ steps.package.outputs.name }}"
          if [ -z "$RELEASE_SIGNING_KEY" ]; then echo "no release key set; this release goes out unsigned"; exit 0; fi
          apt-get install -y --no-install-recommends openssl >/dev/null
          key="$(mktemp)"; chmod 600 "$key"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" -in "${name}.tar.gz" -out "${name}.tar.gz.sig"
          rm -f "$key"
          openssl pkeyutl -verify -rawin -pubin -inkey packaging/release-signing.pub \
            -in "${name}.tar.gz" -sigfile "${name}.tar.gz.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256

      # The desktop app: the same Flutter app as on phones, with the core
      # built above bundled inside it.
      - name: Build the desktop app
        if: matrix.arch == 'x86_64'
        id: app
        run: |
          version=$(git describe --tags --match 'v*' --always --dirty)
          app="corded-app-${version}-linux-x86_64"
          apt-get install -y --no-install-recommends clang libgtk-3-dev liblzma-dev xz-utils libglu1-mesa unzip zip
          git clone --quiet --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git /opt/flutter
          git config --global --add safe.directory /opt/flutter
          export PATH="/opt/flutter/bin:$PATH"
          flutter config --no-analytics >/dev/null
          cd frontends/flutter/app
          flutter pub get
          CORDED_CORE_LIB="$GITHUB_WORKSPACE/build/dev/lib/libcorded.so" flutter build linux --release
          cd "$GITHUB_WORKSPACE"
          mkdir -p "dist/${app}"
          cp -r frontends/flutter/app/build/linux/x64/release/bundle/. "dist/${app}/"
          cp packaging/README-desktop.txt "dist/${app}/README.txt"
          cp assets/logo/variants/corded-icon-indigo.png "dist/${app}/corded.png"
          tar -C dist -czf "${app}.tar.gz" "${app}"
          echo "name=${app}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x86_64'
        with:
          name: ${{ steps.app.outputs.name }}
          path: ${{ steps.app.outputs.name }}.tar.gz

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get install -y --no-install-recommends gh || true
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --prerelease \
            --notes "Pre-alpha build. Not security audited. See the README for how to run it."
          gh release upload "$tag" "${{ steps.package.outputs.name }}.tar.gz" \
            "${{ steps.package.outputs.name }}.tar.gz.sha256" --clobber
          if [ -f "${{ steps.package.outputs.name }}.tar.gz.sig" ]; then
            gh release upload "$tag" "${{ steps.package.outputs.name }}.tar.gz.sig" --clobber
          fi
          if [ -n "${{ steps.app.outputs.name }}" ]; then
            gh release upload "$tag" "${{ steps.app.outputs.name }}.tar.gz" --clobber
          fi

  android:
    name: Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 git curl zip unzip tar \
            perl autoconf automake libtool autoconf-archive

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-android-arm64-v8a-${{ hashFiles('vcpkg.json', '.gitmodules') }}
          restore-keys: vcpkg-android-arm64-v8a-

      - name: Build the core for phones
        run: |
          git submodule update --init external/vcpkg
          ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cmake --preset android-arm64
          cmake --build --preset android-arm64
          mkdir -p frontends/flutter/app/android/app/src/main/jniLibs/arm64-v8a
          cp build/android-arm64/lib/libcorded.so frontends/flutter/app/android/app/src/main/jniLibs/arm64-v8a/

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # With the signing key stored in the repository's secrets, every build
      # can be installed over the last. Without it the app is signed with a
      # throwaway key and has to be uninstalled before a newer one goes on.
      - name: Build the app
        working-directory: frontends/flutter/app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          CORDED_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/corded.jks"
            export CORDED_KEYSTORE="$RUNNER_TEMP/corded.jks"
          else
            echo "::warning::No signing key in secrets; this APK is signed with a throwaway key."
          fi
          flutter pub get
          flutter analyze
          flutter build apk --release --target-platform android-arm64 \
            --build-name "$(git describe --tags --match 'v*' --always | sed 's/^v//')" --build-number "${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/corded-android-arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: corded-android-arm64
          path: corded-android-arm64.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --prerelease \
            --notes "Pre-alpha build. Not security audited. See the README for how to run it."
          gh release upload "$tag" corded-android-arm64.apk --clobber

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', '.gitmodules') }}
          restore-keys: vcpkg-windows-

      - name: Fetch vcpkg
        shell: cmd
        run: |
          git submodule update --init --depth 1 external/vcpkg
          call external\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --preset windows || exit /b 1
          cmake --build --preset windows || exit /b 1

      - name: Unit tests
        shell: cmd
        run: build\windows\bin\corded_unit_tests.exe

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = git describe --tags --match 'v*' --always --dirty
          $name = "corded-$version-windows-x64"
          New-Item -ItemType Directory -Force "dist\$name" | Out-Null
          Copy-Item build\windows\bin\cordedd.exe, build\windows\bin\corded-tui.exe, build\windows\bin\corded-cli.exe, build\windows\bin\corded.dll "dist\$name\"
          Copy-Item packaging\README-windows.txt "dist\$name\README.txt"
          Copy-Item LICENSE "dist\$name\"
          Compress-Archive -Path "dist\$name" -DestinationPath "$name.zip"
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.zip

      # The desktop app, with the core built above beside its program.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Build the desktop app
        id: app
        shell: pwsh
        run: |
          $version = git describe --tags --match 'v*' --always --dirty
          $app = "corded-app-$version-windows-x64"
          $env:CORDED_CORE_DLL = "$env:GITHUB_WORKSPACE\build\windows\bin\corded.dll"
          Push-Location frontends\flutter\app
          flutter pub get
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Pop-Location
          New-Item -ItemType Directory -Force "dist\$app" | Out-Null
          Copy-Item -Recurse frontends\flutter\app\build\windows\x64\runner\Release\* "dist\$app\"
          Copy-Item packaging\README-desktop.txt "dist\$app\README.txt"
          Compress-Archive -Path "dist\$app" -DestinationPath "$app.zip"
          "name=$app" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app.outputs.name }}
          path: ${{ steps.app.outputs.name }}.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --prerelease \
            --notes "Pre-alpha build. Not security audited. See the README for how to run it."
          gh release upload "$tag" "${{ steps.package.outputs.name }}.zip" --clobber
          gh release upload "$tag" "${{ steps.app.outputs.name }}.zip" --clobber
