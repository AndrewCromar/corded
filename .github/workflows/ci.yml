name: CI

on:
  push:
    branches: [main, prototype, next]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 git curl zip unzip tar \
            perl

      # Dependencies are built by vcpkg; caching its binary archives keeps
      # later runs fast.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', '.gitmodules') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # Ubuntu's libsodium is too old, so the build fetches and builds its own.
      - name: Build
        run: ./build.sh

      - name: Test
        run: ctest --preset dev

      # The bots live in repositories of their own and are written against
      # corded-cli. Their kit's test is run here against this build, so that a
      # change to the core that breaks every bot is seen before it is released.
      - name: The bot kit still works with this build
        run: |
          git clone --depth 1 https://github.com/opencorded/bot-kit ../bot-kit
          python3 -u ../bot-kit/tests/kit_smoke.py "$PWD/build/dev/bin"

      - name: Check that libcorded exports only its C interface
        run: |
          extra=$(nm -D --defined-only build/dev/lib/libcorded.so | grep -v -E ' T corded_| A CORDED_0' || true)
          if [ -n "$extra" ]; then echo "unexpected exported symbols:"; echo "$extra"; exit 1; fi

  android:
    name: Android build of the core
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: android-arm64
            abi: arm64-v8a
          - preset: android-x64
            abi: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 git curl zip unzip tar \
            perl autoconf automake libtool autoconf-archive

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-android-${{ matrix.abi }}-${{ hashFiles('vcpkg.json', '.gitmodules') }}
          restore-keys: vcpkg-android-${{ matrix.abi }}-

      - name: Fetch vcpkg
        run: |
          git submodule update --init external/vcpkg
          ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      # The build machines come with the Android NDK installed.
      - name: Build libcorded
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

      - name: Check the library
        run: |
          lib=build/${{ matrix.preset }}/lib/libcorded.so
          file "$lib"
          nm="$(ls "${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm)"
          extra=$("$nm" -D --defined-only "$lib" | grep -v -E ' T corded_| A CORDED_0' || true)
          if [ -n "$extra" ]; then echo "unexpected exported symbols:"; echo "$extra"; exit 1; fi
          needed=$("$(dirname "$nm")/llvm-readelf" -d "$lib" | grep NEEDED)
          echo "$needed"
          # Only libraries every Android phone has may be needed at run time.
          if echo "$needed" | grep -v -E 'lib(c|m|dl|log)\.so'; then echo "needs a library a phone does not have"; exit 1; fi

      - name: Package
        run: |
          mkdir -p out/jniLibs/${{ matrix.abi }} out/include/corded
          cp build/${{ matrix.preset }}/lib/libcorded.so out/jniLibs/${{ matrix.abi }}/
          cp include/corded/corded.h out/include/corded/
          cp LICENSE NOTICE out/

      - uses: actions/upload-artifact@v4
        with:
          name: libcorded-${{ matrix.preset }}
          path: out/

  dart:
    name: Dart binding
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 git curl zip unzip tar perl
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', '.gitmodules') }}
          restore-keys: vcpkg-${{ runner.os }}-
      - name: Build
        run: ./build.sh
      - uses: dart-lang/setup-dart@v1
      # Two clients driven from Dart talk through a real server.
      - name: Test the binding
        working-directory: frontends/flutter/packages/corded_dart
        env:
          CORDED_BIN: ${{ github.workspace }}/build/dev/bin
          CORDED_LIB: ${{ github.workspace }}/build/dev/lib/libcorded.so
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

  windows:
    name: Windows build
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', '.gitmodules') }}
          restore-keys: vcpkg-windows-

      - name: Fetch vcpkg
        shell: cmd
        run: |
          git submodule update --init --depth 1 external/vcpkg
          call external\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --preset windows || exit /b 1
          cmake --build --preset windows || exit /b 1

      - name: Unit tests
        shell: cmd
        run: build\windows\bin\corded_unit_tests.exe

      - name: Smoke test the programs
        shell: cmd
        run: |
          build\windows\bin\cordedd.exe --help
          build\windows\bin\corded-tui.exe --help

      # The one-line installer from the README, against the latest published release.
      - name: Check the PowerShell installer
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & ([scriptblock]::Create((Get-Content -Raw packaging\install.ps1))) -NoRun
          $exe = Get-ChildItem -Path "$env:LOCALAPPDATA\Corded" -Filter corded-tui.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "the installer did not produce corded-tui.exe" }
          & $exe.FullName --help

      # The step that puts an app update in place on Windows, run for real:
      # a program that is running (so its file is locked) is replaced once it
      # ends, by the same script the app starts, under the Windows PowerShell
      # that every Windows has.
      - uses: dart-lang/setup-dart@v1

      - name: Check the app's update script
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'update-check'
          $target = Join-Path $work 'app folder'      # a space, as in real paths
          $source = Join-Path $work 'new'
          New-Item -ItemType Directory -Force $target, $source, (Join-Path $source 'data') | Out-Null
          Copy-Item C:\Windows\System32\ping.exe (Join-Path $target 'corded_app.exe')
          Set-Content (Join-Path $target 'old.txt') 'old'
          Copy-Item C:\Windows\System32\whoami.exe (Join-Path $source 'corded_app.exe')
          Set-Content (Join-Path $source 'data\new.txt') 'new'
          $running = Start-Process -FilePath (Join-Path $target 'corded_app.exe') -ArgumentList '-n','6','127.0.0.1' -PassThru -WindowStyle Hidden
          $log = Join-Path $work 'update.log'
          # Started exactly as the app starts it: by a program that ends at once.
          dart frontends\flutter\app\tool\launch_update.dart (Resolve-Path frontends\flutter\app\assets\apply-update.ps1) `
            $running.Id $source $target (Join-Path $target 'corded_app.exe') $log
          $global:LASTEXITCODE = 0
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern '  OK$' -Quiet)) { $ok = $true }
          }
          if (Test-Path $log) { Get-Content $log } else { 'no log was written: the script never ran' }
          if (-not $ok) { throw 'the update did not happen' }
          $new = (Get-FileHash (Join-Path $source 'corded_app.exe')).Hash
          $now = (Get-FileHash (Join-Path $target 'corded_app.exe')).Hash
          if ($new -ne $now) { throw 'the program was not replaced' }
          if (-not (Test-Path (Join-Path $target 'data\new.txt'))) { throw 'a new file in a folder did not arrive' }
          if (-not (Test-Path (Join-Path $target 'old.txt'))) { throw 'a file the update does not carry was removed' }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\corded-windows-x64 | Out-Null
          Copy-Item build\windows\bin\cordedd.exe, build\windows\bin\corded-tui.exe, build\windows\bin\corded-cli.exe, build\windows\bin\corded.dll dist\corded-windows-x64\
          Copy-Item packaging\README.txt, LICENSE dist\corded-windows-x64\
          Compress-Archive -Path dist\corded-windows-x64 -DestinationPath corded-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: corded-windows-x64
          path: corded-windows-x64.zip
