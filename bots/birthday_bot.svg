<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- The birthday bot's picture: a cake with three candles. It is shown in a
       circle, so everything that matters stays inside one. The PNG beside
       this file is made from it: rsvg-convert -w 128 birthday_bot.svg -o birthday_bot.png -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3fa8"/>
      <stop offset="1" stop-color="#2e1f63"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" fill="url(#sky)"/>

  <!-- the light of the candles -->
  <circle cx="64" cy="34" r="30" fill="url(#glow)"/>

  <!-- plate -->
  <ellipse cx="64" cy="101" rx="43" ry="6" fill="#d9d4ee"/>
  <ellipse cx="64" cy="99.5" rx="43" ry="5" fill="#f4f1ff"/>

  <!-- lower tier -->
  <rect x="27" y="71" width="74" height="29" rx="6" fill="#f6b6cf"/>
  <rect x="27" y="84" width="74" height="5" fill="#e889ad"/>
  <!-- its icing, running down -->
  <path d="M27 77 q0 -6 6 -6 h62 q6 0 6 6 v3 q0 5 -4.6 5 t-4.6 -4 q0 -3 -4.6 -3 t-4.6 5 q0 5 -4.7 5 t-4.7 -6 q0 -3 -4.6 -3 t-4.6 4 q0 6 -4.7 6 t-4.7 -5 q0 -4 -4.6 -4 t-4.6 3 q0 4 -4.6 4 t-4.6 -5 q0 -3 -4.6 -3 t-4.6 4 z" fill="#fff7fb"/>

  <!-- upper tier -->
  <rect x="39" y="50" width="50" height="23" rx="5" fill="#f9c9dc"/>
  <path d="M39 55 q0 -5 5 -5 h40 q5 0 5 5 v3 q0 4 -4.2 4 t-4.2 -4 q0 -2 -4.1 -2 t-4.1 4 q0 5 -4.2 5 t-4.2 -5 q0 -3 -4.2 -3 t-4.2 3 q0 4 -4.1 4 t-4.1 -4 q0 -2 -3.8 -2 t-3.8 3 z" fill="#fff7fb"/>

  <!-- sprinkles -->
  <g stroke-width="2.4" stroke-linecap="round">
    <path d="M36 93 l4 -2" stroke="#6fd3c3"/>
    <path d="M52 95 l3 3" stroke="#ffd76a"/>
    <path d="M70 93 l4 1" stroke="#8fa8ff"/>
    <path d="M87 95 l3 -3" stroke="#6fd3c3"/>
    <path d="M48 68 l3 -2" stroke="#8fa8ff"/>
    <path d="M77 67 l3 2" stroke="#ffd76a"/>
  </g>

  <!-- candles -->
  <g>
    <rect x="47.5" y="35" width="5" height="16" rx="1.5" fill="#6fd3c3"/>
    <rect x="61.5" y="31" width="5" height="20" rx="1.5" fill="#ffd76a"/>
    <rect x="75.5" y="35" width="5" height="16" rx="1.5" fill="#8fa8ff"/>
    <g stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.4">
      <path d="M47.5 40 l5 -3 M47.5 46 l5 -3"/>
      <path d="M61.5 37 l5 -3 M61.5 43 l5 -3 M61.5 49 l5 -3"/>
      <path d="M75.5 40 l5 -3 M75.5 46 l5 -3"/>
    </g>
  </g>

  <!-- flames -->
  <g>
    <path d="M50 21 q5 6 3.4 10 a3.6 3.6 0 0 1 -6.8 0 q-1.6 -4 3.4 -10 z" fill="#ff9a3c"/>
    <path d="M50 26 q2.4 3 1.6 5 a1.8 1.8 0 0 1 -3.2 0 q-0.8 -2 1.6 -5 z" fill="#fff2b0"/>
    <path d="M64 16 q5.4 6.6 3.7 11 a3.9 3.9 0 0 1 -7.4 0 q-1.7 -4.4 3.7 -11 z" fill="#ff9a3c"/>
    <path d="M64 21.5 q2.6 3.2 1.8 5.4 a1.9 1.9 0 0 1 -3.6 0 q-0.8 -2.2 1.8 -5.4 z" fill="#fff2b0"/>
    <path d="M78 21 q5 6 3.4 10 a3.6 3.6 0 0 1 -6.8 0 q-1.6 -4 3.4 -10 z" fill="#ff9a3c"/>
    <path d="M78 26 q2.4 3 1.6 5 a1.8 1.8 0 0 1 -3.2 0 q-0.8 -2 1.6 -5 z" fill="#fff2b0"/>
  </g>
</svg>
