<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- The AI bot's picture: a sprig of sage with a spark of thought beside it.
       It is shown in a circle, so everything that matters stays inside one.
       The PNG beside this file is made from it:
       rsvg-convert -w 128 ai_bot.svg -o ai_bot.png -->
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5a52"/>
      <stop offset="1" stop-color="#10302f"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe8c4"/>
      <stop offset="1" stop-color="#8fc3a0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" fill="url(#dusk)"/>

  <!-- the stem -->
  <path d="M58 106 C60 86 62 62 66 30" fill="none" stroke="#7fb592" stroke-width="3.5" stroke-linecap="round"/>

  <!-- leaves, in pairs up the stem; each with its midrib -->
  <g fill="url(#leaf)" stroke="#5f9a7a" stroke-width="1">
    <path d="M59 94 C44 96 31 88 27 75 C41 71 54 79 59 94 Z"/>
    <path d="M60 90 C74 91 87 83 91 70 C77 67 65 76 60 90 Z"/>
    <path d="M61 72 C48 73 37 65 34 53 C47 50 58 59 61 72 Z"/>
    <path d="M62 68 C74 68 84 60 87 48 C75 46 65 55 62 68 Z"/>
    <path d="M64 50 C54 50 46 43 44 33 C54 31 62 39 64 50 Z"/>
    <path d="M66 30 C60 22 62 12 69 8 C75 14 74 24 66 30 Z"/>
  </g>
  <g fill="none" stroke="#5f9a7a" stroke-width="1" stroke-linecap="round" opacity="0.8">
    <path d="M57 92 C47 88 37 81 30 76"/>
    <path d="M62 88 C71 84 81 77 88 71"/>
    <path d="M59 70 C51 66 42 59 37 54"/>
    <path d="M64 66 C71 62 79 55 84 49"/>
    <path d="M63 48 C57 44 50 38 46 34"/>
    <path d="M66 28 C66 22 67 15 69 10"/>
  </g>

  <!-- a spark of thought -->
  <circle cx="96" cy="32" r="20" fill="url(#glow)"/>
  <path d="M96 19 L99 29 L109 32 L99 35 L96 45 L93 35 L83 32 L93 29 Z" fill="#ffe9a8"/>
  <path d="M110 48 L111.5 52.5 L116 54 L111.5 55.5 L110 60 L108.5 55.5 L104 54 L108.5 52.5 Z" fill="#ffe9a8" opacity="0.85"/>
</svg>
