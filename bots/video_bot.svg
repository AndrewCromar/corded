<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- The video bot's picture: a screen with a play mark, and an arrow
       bringing it down. It is shown in a circle, so everything that matters
       stays inside one. The PNG beside this file is made from it:
       rsvg-convert -w 128 video_bot.svg -o video_bot.png -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12736b"/>
      <stop offset="1" stop-color="#0b3f46"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dff5f1"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" fill="url(#back)"/>

  <!-- the screen -->
  <rect x="27" y="29" width="74" height="48" rx="9" fill="#082c33" opacity="0.45" transform="translate(0 3)"/>
  <rect x="27" y="29" width="74" height="48" rx="9" fill="url(#screen)"/>
  <!-- the play mark -->
  <path d="M56.5 42.5 a2.6 2.6 0 0 1 3.9 -2.2 l16.4 10.5 a2.6 2.6 0 0 1 0 4.4 l-16.4 10.5 a2.6 2.6 0 0 1 -3.9 -2.2 z" fill="#ff7a59"/>

  <!-- the arrow down, and the tray it lands in -->
  <g fill="none" stroke="#ffd76a" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 81 v15"/>
    <path d="M54.5 89.5 l9.5 9.5 l9.5 -9.5"/>
    <path d="M43 101 v4 a4 4 0 0 0 4 4 h34 a4 4 0 0 0 4 -4 v-4"/>
  </g>
</svg>
