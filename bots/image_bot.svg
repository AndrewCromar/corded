<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- The image bot's picture: a small framed landscape with a brush across
       its corner. It is shown in a circle, so everything that matters stays
       inside one. The PNG beside this file is made from it:
       rsvg-convert -w 128 image_bot.svg -o image_bot.png -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6542f"/>
      <stop offset="1" stop-color="#6e2a2c"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd58a"/>
      <stop offset="1" stop-color="#ff9e7a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" fill="url(#wall)"/>

  <!-- the frame and the canvas in it -->
  <rect x="26" y="34" width="70" height="56" rx="5" fill="#f6e7c8"/>
  <rect x="32" y="40" width="58" height="44" rx="2" fill="url(#sky)"/>
  <clipPath id="canvas"><rect x="32" y="40" width="58" height="44" rx="2"/></clipPath>
  <g clip-path="url(#canvas)">
    <circle cx="72" cy="54" r="8" fill="#fff4cf"/>
    <path d="M24 84 L46 58 L58 72 L68 62 L96 84 Z" fill="#7a4f8f"/>
    <path d="M24 86 L40 70 L52 80 L64 72 L80 82 L96 76 L96 90 L24 90 Z" fill="#4c3a78"/>
  </g>

  <!-- a brush, laid across the lower corner -->
  <g transform="rotate(-38 88 88)">
    <rect x="62" y="85" width="40" height="6" rx="3" fill="#e9c98f"/>
    <rect x="52" y="84.5" width="11" height="7" fill="#c9cdd6"/>
    <path d="M52 84.5 C44 84 38 86 34 88 C38 90 44 92 52 91.5 Z" fill="#3fb6a8"/>
  </g>
</svg>
