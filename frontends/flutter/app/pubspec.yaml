name: corded_app
description: The Corded graphical client.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  corded_dart:
    path: ../packages/corded_dart
  path_provider: ^2.1.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  characters: ^1.3.0
  flutter_local_notifications: ^19.0.0
  flutter_foreground_task: ^9.0.0
  biometric_storage: ^5.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0
  image_picker: ^1.1.0
  image: ^4.2.0
  open_filex: ^4.7.0
  file_selector: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/apply-update.ps1
